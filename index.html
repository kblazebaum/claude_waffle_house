<head>
<meta charset="UTF-8">

<title>🧇 Waffle House Explorer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;background:#1a1a2e;color:#eee;display:flex;flex-direction:column;height:100vh;overflow:hidden}

  #toolbar{background:#16213e;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:2px solid #f5a623;flex-shrink:0}
  #toolbar h1{font-size:1.1rem;font-weight:700;color:#f5a623;white-space:nowrap;margin-right:8px}
  .filters{display:flex;gap:8px;flex-wrap:wrap}
  .btn{display:flex;align-items:center;gap:6px;padding:5px 12px;border:2px solid transparent;border-radius:20px;cursor:pointer;font-size:0.82rem;font-weight:600;background:#0f3460;color:#ccc;transition:all .15s}
  .btn .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .btn.active{color:#fff;border-color:currentColor}
  .btn.corporate.active{color:#4a9eff;border-color:#4a9eff;background:rgba(74,158,255,.15)}
  .btn.subsidiary.active{color:#4caf50;border-color:#4caf50;background:rgba(76,175,80,.15)}
  .btn.franchise.active{color:#ff9800;border-color:#ff9800;background:rgba(255,152,0,.15)}
  .dot.corporate{background:#4a9eff}
  .dot.subsidiary{background:#4caf50}
  .dot.franchise{background:#ff9800}
  #stats{margin-left:auto;font-size:0.78rem;color:#aaa;white-space:nowrap}

  #main{display:flex;flex:1;overflow:hidden}
  #map{flex:0 0 62%;height:100%}
  #sidebar{flex:1;display:flex;flex-direction:column;background:#0d1b2a;overflow:hidden}
  #chart-wrap{flex:1;padding:14px 14px 6px;overflow:hidden;display:flex;flex-direction:column}
  #chart-title{font-size:0.8rem;color:#aaa;margin-bottom:8px;text-align:center}
  #chart-container{flex:1;overflow-y:auto;position:relative}
  canvas#chart{display:block}

  .leaflet-popup-content-wrapper{background:#1a1a2e;color:#eee;border:1px solid #f5a623;border-radius:8px}
  .leaflet-popup-tip{background:#1a1a2e}
  .popup-name{font-weight:700;color:#f5a623;font-size:0.9rem;margin-bottom:4px}
  .popup-badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:0.7rem;font-weight:600;margin-bottom:6px}
  .popup-badge.corporate{background:rgba(74,158,255,.25);color:#4a9eff}
  .popup-badge.subsidiary{background:rgba(76,175,80,.25);color:#4caf50}
  .popup-badge.franchise{background:rgba(255,152,0,.25);color:#ff9800}
  .popup-row{font-size:0.78rem;margin-bottom:2px;color:#ccc}
  .popup-link{display:inline-block;margin-top:6px;font-size:0.75rem;background:#f5a623;color:#000;padding:3px 10px;border-radius:4px;text-decoration:none;font-weight:700}

  @media(max-width:700px){
    #main{flex-direction:column}
    #map{flex:0 0 55%;width:100%}
    #sidebar{height:45%}
  }
</style>
</head>
<body>

<div id="toolbar">
  <h1>🧇 Waffle House Explorer</h1>
  <div class="filters">
    <button class="btn corporate active" data-type="corporate" onclick="toggleFilter('corporate',this)">
      <span class="dot corporate"></span>Corporate
    </button>
    <button class="btn subsidiary active" data-type="subsidiary" onclick="toggleFilter('subsidiary',this)">
      <span class="dot subsidiary"></span>Subsidiary
    </button>
    <button class="btn franchise active" data-type="franchise" onclick="toggleFilter('franchise',this)">
      <span class="dot franchise"></span>Franchise
    </button>
  </div>
  <span id="stats">Loading…</span>
</div>

<div id="main">
  <div id="map"></div>
  <div id="sidebar">
    <div id="chart-wrap">
      <div id="chart-title">Locations by state — click a bar to zoom map</div>
      <div id="chart-container"><canvas id="chart"></canvas></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

const COLORS = {corporate:'#4a9eff', subsidiary:'#4caf50', franchise:'#ff9800'};
const activeTypes = new Set(['corporate','subsidiary','franchise']);
let selectedState = null;
let chart = null;
let markers = {}; // code -> {marker, loc}
let clusterGroup;

// ── Map ──────────────────────────────────────────────────────────────────────
const map = L.map('map', {preferCanvas: true}).setView([33.5, -86], 5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 19
}).addTo(map);

clusterGroup = L.markerClusterGroup({
  chunkedLoading: true,
  maxClusterRadius: 50,
  iconCreateFunction(cluster) {
    const n = cluster.getChildCount();
    const sz = n > 100 ? 44 : n > 20 ? 36 : 28;
    return L.divIcon({
      html: `<div style="width:${sz}px;height:${sz}px;border-radius:50%;background:#f5a623;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:${sz>36?13:11}px;color:#000;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)">${n}</div>`,
      className:'', iconSize:[sz,sz], iconAnchor:[sz/2,sz/2]
    });
  }
});
map.addLayer(clusterGroup);

function makeMarker(loc) {
  const col = COLORS[loc.t];
  const m = L.circleMarker([loc.la, loc.lo], {
    radius: 6, fillColor: col, color:'#fff', weight: 1.2,
    fillOpacity: 0.9, opacity: 1
  });
  const orderLink = loc.o ? `<a class="popup-link" href="${loc.o}" target="_blank">Order Online</a>` : '';
  m.bindPopup(`
    <div class="popup-name">${loc.n}</div>
    <span class="popup-badge ${loc.t}">${loc.t}</span>
    <div class="popup-row">📍 ${loc.a}, ${loc.ci}, ${loc.st} ${loc.z}</div>
    <div class="popup-row">📞 ${loc.ph}</div>
    <div class="popup-row">🕐 ${loc.h}</div>
    ${orderLink}
  `, {maxWidth: 240});
  return m;
}

// Build all markers once
LOCATIONS.forEach(loc => {
  markers[loc.c] = {marker: makeMarker(loc), loc};
});

// ── Filters & rendering ───────────────────────────────────────────────────────
function applyFilters() {
  clusterGroup.clearLayers();
  let visible = 0;
  Object.values(markers).forEach(({marker, loc}) => {
    const show = activeTypes.has(loc.t) &&
                 (selectedState === null || loc.st === selectedState);
    if (show) { clusterGroup.addLayer(marker); visible++; }
  });
  document.getElementById('stats').textContent =
    `${visible.toLocaleString()} of ${LOCATIONS.length.toLocaleString()} locations`;
  updateChart();
}

function toggleFilter(type, btn) {
  if (activeTypes.has(type)) {
    if (activeTypes.size === 1) return; // keep at least one
    activeTypes.delete(type);
    btn.classList.remove('active');
  } else {
    activeTypes.add(type);
    btn.classList.add('active');
  }
  applyFilters();
}

// ── State bounding boxes (precomputed from data) ──────────────────────────────
const stateBounds = {};
LOCATIONS.forEach(loc => {
  if (!stateBounds[loc.st]) stateBounds[loc.st] = [loc.la,loc.lo,loc.la,loc.lo];
  const b = stateBounds[loc.st];
  if (loc.la < b[0]) b[0]=loc.la;
  if (loc.lo < b[1]) b[1]=loc.lo;
  if (loc.la > b[2]) b[2]=loc.la;
  if (loc.lo > b[3]) b[3]=loc.lo;
});

// ── Chart ─────────────────────────────────────────────────────────────────────
function getStateCounts() {
  const counts = {};
  Object.values(markers).forEach(({loc}) => {
    if (!activeTypes.has(loc.t)) return;
    counts[loc.st] = (counts[loc.st] || 0) + 1;
  });
  return Object.entries(counts).sort((a,b) => b[1]-a[1]);
}

function buildChart(entries) {
  const labels = entries.map(e => e[0]);
  const values = entries.map(e => e[1]);
  const barColors = labels.map(st =>
    st === selectedState ? '#f5a623' : 'rgba(245,166,35,0.4)'
  );
  const ctx = document.getElementById('chart').getContext('2d');

  // Size canvas to fit all bars
  const barH = 20, pad = 60;
  document.getElementById('chart').height = labels.length * barH + pad;

  if (chart) chart.destroy();
  chart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data: values,
        backgroundColor: barColors,
        borderColor: barColors.map(c => c === '#f5a623' ? '#fff' : 'transparent'),
        borderWidth: 1,
        borderRadius: 3,
      }]
    },
    options: {
      indexAxis: 'y',
      animation: false,
      responsive: false,
      maintainAspectRatio: false,
      plugins: {
        legend: {display: false},
        tooltip: {
          callbacks: {
            label: ctx => ` ${ctx.raw} locations`
          }
        }
      },
      scales: {
        x: {
          ticks: {color:'#aaa', font:{size:10}},
          grid: {color:'rgba(255,255,255,0.06)'}
        },
        y: {
          ticks: {color:'#ddd', font:{size:11}},
          grid: {display:false}
        }
      },
      onClick(evt, elements) {
        if (!elements.length) {
          if (selectedState) { selectedState = null; applyFilters(); }
          return;
        }
        const idx = elements[0].index;
        const st = chart.data.labels[idx];
        if (selectedState === st) {
          selectedState = null;
          applyFilters();
        } else {
          selectedState = st;
          applyFilters();
          const b = stateBounds[st];
          if (b) map.fitBounds([[b[0]-0.3,b[1]-0.3],[b[2]+0.3,b[3]+0.3]]);
        }
      }
    }
  });
}

function updateChart() {
  const entries = getStateCounts();
  buildChart(entries);
}

// ── Init ──────────────────────────────────────────────────────────────────────
applyFilters();
</script>
</body>
</html>
